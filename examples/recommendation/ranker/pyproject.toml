[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recarena-ranker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyserini==2.4.0",
  "pyarrow==25.0.1",
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "torch==2.9.1+cpu",
  "transformers==5.0.0",
  "recarena-contracts"
]

[dependency-groups]
metadata = ["recarena-data"]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.uv.sources]
recarena-data = { path = "../../data", editable = true }
recarena-contracts = { path = "../../../contracts", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["recarena_ranker"]
