worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  upstream ranking_workers {
    zone ranking_workers 64k;
    least_conn;
    server ranking-worker:8011 resolve;
    keepalive 32;
    # Uvicorn closes idle upstream connections after five seconds.
    keepalive_timeout 1s;
  }

  # No query strings, credentials or request/response bodies in these logs.
  log_format ranking escape=json '{"at":"$msec","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr",'
    '"seconds":"$request_time","upstream_seconds":"$upstream_response_time",'
    '"request_id":"$upstream_http_x_request_id"}';
  map $uri $log_request { /health/ready 0; default 1; }
  access_log /dev/stdout ranking if=$log_request;

  server {
    listen 8011;
    server_name _;
    client_max_body_size 0;
    keepalive_timeout 60s;
    location / {
      proxy_pass http://ranking_workers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_max_temp_file_size 0;
      # Preserve one upstream attempt, including registration POSTs.
      proxy_next_upstream off;
    }
  }
}
