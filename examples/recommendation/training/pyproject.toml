[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recarena-training"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "recbole==1.2.1",
  "torch==2.5.1",
  "numpy==1.26.4",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "scikit-learn==1.3.2",
  "ray==2.6.3",
  "pyarrow==12.0.1",
  "tensorboard==2.18.0",
  "recarena-contracts"
]

[tool.uv.sources]
recarena-contracts = { path = "../../../contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["recarena_training"]
