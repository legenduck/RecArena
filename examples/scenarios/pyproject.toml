[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recarena-scenarios"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["duckdb==1.5.6", "jsonschema==4.26.0", "PyYAML==6.0.3", "recarena-llm"]

[project.optional-dependencies]
llm = ["recarena-llm[api]"]

[project.scripts]
recarena-scenarios = "recarena_scenarios.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["recarena_scenarios"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "recarena_scenarios/default.yaml"
